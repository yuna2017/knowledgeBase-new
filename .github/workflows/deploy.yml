name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 整次生产发布串行完成，避免在迁移或多入口发布中途取消。
concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site-${{ github.sha }}
          path: .
      - name: 仅发布当前 main 的最新提交
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'main 已有更新，本次跳过发布，由更新的运行接替。'
          fi
      - name: 应用向后兼容的数据库迁移
        if: steps.current.outputs.publish == 'true'
        run: npm run db:migrate:remote
      - name: 发布经过验证的静态站及 Pages Functions
        if: steps.current.outputs.publish == 'true'
        env:
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: npx --no-install wrangler pages deploy vitepress-docs/.vitepress/dist --project-name="$PAGES_PROJECT" --branch=main
      - name: 发布兼容旧地址的统计入口
        if: steps.current.outputs.publish == 'true'
        run: npx --no-install wrangler deploy --config worker/wrangler.toml
      - name: 发布同一版本的排行清单
        if: steps.current.outputs.publish == 'true'
        run: npx --no-install wrangler deploy --config worker-ranking/wrangler.toml
      - name: Notify IndexNow
        if: steps.current.outputs.publish == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
