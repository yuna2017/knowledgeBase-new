name: PR 文档检查

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-doc-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Markdown、链接与作者检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 与 deploy.yml 保持一致：lastUpdated、页面历史、标签页和「最近更新」
          # 都依赖每个文件的完整提交历史，浅克隆会让这些数据全部为空，
          # PR 检查就验证不了生产实际会构建出的内容
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown, authors and static build
        run: npm run build
